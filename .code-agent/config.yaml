spec_version: 1
name: pi-go-agent
instructions: CLAUDE.md

executor:
  type: omnigent
  config:
    harness: claude-sdk
    # No profile/auth key: inherits the ambient Claude Code login/credentials
    # already active in the environment this agent is launched from.

async: true

os_env:
  type: caller_process
  cwd: .
  sandbox:
    type: linux_bwrap
    # pi-go itself (this repo) is the only writable tree, plus the Go build
    # and module caches `go build`/`go test` need. Nothing else under ~ is
    # visible (the sandbox binds only what is listed).
    write_paths:
      - .
      - ~/.cache/go-build
      - ~/go/pkg/mod
    # Read-only. SSH is limited to the p16 key (the agent needs it) plus the config that maps the
    # `p16` host to it and known_hosts; the rest of ~/.ssh stays invisible.
    # CAUTION: p16 is passphrase-protected, so ssh can only use it through ssh-agent. The sandbox
    # inherits SSH_AUTH_SOCK, but the socket (/run/user/1000/ssh-agent.sock -> ~/.ssh/agent/s.*)
    # is not bound, so it is unreachable from inside. Use a passphrase-less key for this agent
    # instead of binding the socket, which would expose every key the agent holds.
    # go.mod replaces block-builder/sdk with ../../machina/block-builder-run/sdk;
    # it is granted read-only below so builds resolve it.
    read_paths:
      - ~/.gitconfig
      - ~/.ssh/p16
      - ~/.ssh/config
      - ~/.ssh/known_hosts
      - ../../machina/block-builder-run/sdk
    # Needed to fetch Go modules and reach model providers in tests.
    allow_network: true
